name: "Build Unsigned iOS IPA (TrollStore)"  
  
on:  
  pull_request:  
  push:  
    branches:  
      - main  
  
env:  
  GO_VERSION: "~1.24.0"  
  
permissions:  
  id-token: write  
  contents: read  
  attestations: write  
  
jobs:  
  build-unsigned:  
    runs-on: macos-15  
    steps:  
      - name: Check Xcode version  
        run: |
          /usr/bin/xcodebuild -version  
          sudo /usr/bin/xcode-select -switch /Applications/Xcode_16.4.app/Contents/Developer  
          /usr/bin/xcodebuild -version  
  
      - name: Install iOS platform  
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 18.6  
  
      - name: Check out repository  
        uses: actions/checkout@v3  
  
      - name: Lint  
        run: |
          make lint  
  
      - name: Install Go  
        uses: actions/setup-go@v5  
        with:  
          go-version: ${{ env.GO_VERSION }}  
          cache: false  
          check-latest: true  
  
      - name: Build core  
        run: |
          make core  
  
      - name: Build unsigned iOS IPA  
        run: |
          make ios-unsigned  
  
      - name: Upload unsigned IPA  
        uses: actions/upload-artifact@v4  
        with:  
          name: ios-unsigned  
          path: ./Build/synctrain-unsigned.ipa  
          retention-days: 30  
  
      - name: Display build info  
        run: |
          echo "Build completed successfully!"  
          echo "IPA location: ./Build/synctrain-unsigned.ipa"  
          ls -la ./Build/